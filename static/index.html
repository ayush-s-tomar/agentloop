<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentLoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0f13;
    --panel:#15171d;
    --panel-border:#23262f;
    --text:#e7e8ec;
    --text-dim:#8a8d99;
    --accent:#5eead4;
    --accent-dim:#1c3b36;
    --warn:#f0b429;
    --err:#f1636b;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
  }
  .layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh;}
  @media (max-width:800px){.layout{grid-template-columns:1fr;}}

  .sidebar{
    border-right:1px solid var(--panel-border);
    padding:24px 20px;
    background:var(--panel);
  }
  .sidebar h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
    margin:0 0 16px 0;
  }
  .session-item{
    display:block;width:100%;text-align:left;
    background:transparent;border:1px solid var(--panel-border);
    color:var(--text);padding:10px 12px;border-radius:8px;
    font-family:inherit;font-size:12.5px;margin-bottom:8px;cursor:pointer;
    transition:border-color .15s;
  }
  .session-item:hover{border-color:var(--accent);}
  .empty-hint{color:var(--text-dim);font-size:12.5px;}
  .clear-btn{
    margin-top:20px;width:100%;padding:9px;border-radius:8px;
    background:transparent;border:1px solid var(--err);color:var(--err);
    font-family:inherit;font-size:12px;cursor:pointer;
  }
  .clear-btn:hover{background:rgba(241,99,107,.08);}

  main{padding:40px 48px;max-width:860px;}
  @media (max-width:800px){main{padding:24px;}}

  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--accent-dim);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);font-size:18px;font-weight:700;
  }
  .brand h1{
    font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin:0;
  }
  .tagline{color:var(--text-dim);font-size:13px;margin:0 0 32px 46px;}

  .input-row{display:flex;gap:10px;margin-bottom:36px;}
  #topic{
    flex:1;background:var(--panel);border:1px solid var(--panel-border);
    color:var(--text);padding:13px 16px;border-radius:8px;
    font-family:inherit;font-size:14px;outline:none;
  }
  #topic:focus{border-color:var(--accent);}
  #runBtn{
    background:var(--accent);color:#0e0f13;border:none;
    padding:0 24px;border-radius:8px;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:14px;cursor:pointer;
  }
  #runBtn:disabled{opacity:0.4;cursor:not-allowed;}

  .loop{
    position:relative;padding-left:28px;margin-bottom:32px;display:none;
  }
  .loop.active{display:block;}
  .loop::before{
    content:'';position:absolute;left:9px;top:6px;bottom:6px;width:1px;
    background:var(--panel-border);
  }
  .step{
    position:relative;padding:6px 0 6px 20px;font-size:13px;color:var(--text-dim);
  }
  .step::before{
    content:'';position:absolute;left:-4px;top:11px;width:9px;height:9px;
    border-radius:50%;background:var(--panel-border);border:2px solid var(--bg);
  }
  .step.done{color:var(--text);}
  .step.done::before{background:var(--accent);}
  .step.active{color:var(--accent);}
  .step.active::before{background:var(--accent);box-shadow:0 0 0 4px var(--accent-dim);}
  .step-detail{font-size:12px;color:var(--text-dim);margin-top:2px;font-style:italic;}

  .report{display:none;}
  .report.visible{display:block;}
  .report h3{font-family:'Space Grotesk',sans-serif;font-size:19px;margin-bottom:14px;}
  .report-body{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--radius);
    padding:24px 28px;font-size:13.5px;line-height:1.7;
  }
  .report-body h2{font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--accent);margin-top:22px;}
  .report-body h2:first-child{margin-top:0;}
  .report-body ul{padding-left:20px;}
  .download-btn{
    margin-top:16px;background:transparent;border:1px solid var(--accent);
    color:var(--accent);padding:9px 18px;border-radius:8px;font-family:inherit;
    font-size:12.5px;cursor:pointer;
  }
  .download-btn:hover{background:var(--accent-dim);}
  .error-box{
    display:none;background:rgba(241,99,107,.08);border:1px solid var(--err);
    color:var(--err);padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:20px;
  }
  .error-box.visible{display:block;}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h2>Past sessions</h2>
    <div id="sessionList"><span class="empty-hint">No research runs yet.</span></div>
    <button class="clear-btn" id="clearBtn" style="display:none;">Clear history</button>
  </aside>

  <main>
    <div class="brand"><div class="mark">o</div><h1>AgentLoop</h1></div>
    <p class="tagline">Plans -> Searches -> Reflects -> Sourced report</p>

    <div class="error-box" id="errorBox"></div>

    <div class="input-row">
      <input id="topic" type="text" maxlength="300" placeholder="e.g. impact of the EU AI Act on startups" />
      <button id="runBtn">Run</button>
    </div>

    <div class="loop" id="loop">
      <div class="step" data-node="recall">Checking memory<div class="step-detail" data-detail="recall"></div></div>
      <div class="step" data-node="planner">Planning sub-questions<div class="step-detail" data-detail="planner"></div></div>
      <div class="step" data-node="research">Researching<div class="step-detail" data-detail="research"></div></div>
      <div class="step" data-node="reflect">Reflecting on findings<div class="step-detail" data-detail="reflect"></div></div>
      <div class="step" data-node="synthesize">Writing report<div class="step-detail" data-detail="synthesize"></div></div>
      <div class="step" data-node="persist">Saving to memory<div class="step-detail" data-detail="persist"></div></div>
    </div>

    <div class="report" id="reportBox">
      <h3 id="reportTitle">Report</h3>
      <div class="report-body" id="reportBody"></div>
      <button class="download-btn" id="downloadBtn">Download report (.md)</button>
    </div>
  </main>
</div>

<script>
const NODE_ORDER = ["recall","planner","research","reflect","synthesize","persist"];
let currentReportRaw = "";
let currentTopic = "";

function mdToHtml(md){
  const lines = md.split("\n");
  let html = "", inList = false;
  for(const line of lines){
    if(line.startsWith("## ")){
      if(inList){html+="</ul>";inList=false;}
      html += "<h2>" + line.slice(3) + "</h2>";
    } else if(line.startsWith("- ")){
      if(!inList){html+="<ul>";inList=true;}
      html += "<li>" + line.slice(2) + "</li>";
    } else if(line.trim()===""){
      if(inList){html+="</ul>";inList=false;}
    } else {
      if(inList){html+="</ul>";inList=false;}
      html += "<p>" + line + "</p>";
    }
  }
  if(inList) html+="</ul>";
  return html;
}

function resetLoop(){
  document.querySelectorAll(".step").forEach(function(s){
    s.classList.remove("done","active");
    s.querySelector(".step-detail").textContent = "";
  });
}

function setNodeActive(node){
  document.querySelectorAll(".step").forEach(function(s){s.classList.remove("active");});
  const idx = NODE_ORDER.indexOf(node);
  NODE_ORDER.forEach(function(n,i){
    const el = document.querySelector(".step[data-node=\"" + n + "\"]");
    if(i < idx) el.classList.add("done");
  });
  const el = document.querySelector(".step[data-node=\"" + node + "\"]");
  if(el) el.classList.add("active");
}

function setNodeDone(node){
  const el = document.querySelector(".step[data-node=\"" + node + "\"]");
  if(el){ el.classList.remove("active"); el.classList.add("done"); }
}

function setDetail(node, text){
  const el = document.querySelector(".step-detail[data-detail=\"" + node + "\"]");
  if(el) el.textContent = text || "";
}

function loadSessions(){
  fetch("/api/sessions").then(function(res){return res.json();}).then(function(sessions){
    const list = document.getElementById("sessionList");
    const clearBtn = document.getElementById("clearBtn");
    if(!sessions.length){
      list.innerHTML = '<span class="empty-hint">No research runs yet.</span>';
      clearBtn.style.display = "none";
      return;
    }
    clearBtn.style.display = "block";
    list.innerHTML = "";
    sessions.forEach(function(s){
      const btn = document.createElement("button");
      btn.className = "session-item";
      btn.textContent = (s.topic || "(untitled)").slice(0,60);
      btn.onclick = function(){
        fetch("/api/sessions/" + s.id).then(function(r){return r.json();}).then(function(full){
          if(full && full.report){
            currentReportRaw = full.report;
            currentTopic = full.topic;
            showReport(full.topic, full.report);
          }
        });
      };
      list.appendChild(btn);
    });
  }).catch(function(e){ console.error(e); });
}

document.getElementById("clearBtn").onclick = function(){
  if(!confirm("Delete all past sessions? This can't be undone.")) return;
  fetch("/api/sessions", {method:"DELETE"}).then(function(){ loadSessions(); });
};

function showReport(topic, report){
  document.getElementById("reportTitle").textContent = topic || "Report";
  document.getElementById("reportBody").innerHTML = mdToHtml(report);
  document.getElementById("reportBox").classList.add("visible");
}

document.getElementById("downloadBtn").onclick = function(){
  const blob = new Blob([currentReportRaw], {type:"text/markdown"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "agentloop_report.md";
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById("runBtn").onclick = function(){
  const topic = document.getElementById("topic").value.trim();
  const errorBox = document.getElementById("errorBox");
  errorBox.classList.remove("visible");
  document.getElementById("reportBox").classList.remove("visible");
  if(!topic){
    errorBox.textContent = "Topic cannot be empty.";
    errorBox.classList.add("visible");
    return;
  }
  currentTopic = topic;
  const runBtn = document.getElementById("runBtn");
  runBtn.disabled = true;
  resetLoop();
  document.getElementById("loop").classList.add("active");

  fetch("/api/run", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({topic:topic})
  }).then(function(res){
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    function pump(){
      return reader.read().then(function(result){
        if(result.done) return;
        buffer += decoder.decode(result.value, {stream:true});
        const events = buffer.split("\n\n");
        buffer = events.pop();
        events.forEach(function(ev){
          const lines = ev.split("\n");
          let eventType = "message", data = "{}";
          lines.forEach(function(l){
            if(l.indexOf("event: ") === 0) eventType = l.slice(7);
            if(l.indexOf("data: ") === 0) data = l.slice(6);
          });
          const payload = JSON.parse(data);
          if(eventType === "node"){
            setNodeActive(payload.node);
            if(payload.node === "planner" && payload.plan){
              setDetail("planner", payload.plan.join(" | "));
            }
            if(payload.node === "research" && payload.message){
              setDetail("research", payload.message);
            }
            if(payload.node === "reflect"){
              setDetail("reflect", payload.decision === "more_research" ? "Found gaps -- researching more" : "Notes sufficient");
            }
            if(payload.node === "synthesize" && payload.report){
              currentReportRaw = payload.report;
            }
            setNodeDone(payload.node);
          } else if(eventType === "done"){
            if(currentReportRaw) showReport(currentTopic, currentReportRaw);
            loadSessions();
          } else if(eventType === "error"){
            errorBox.textContent = payload.message || "Something went wrong.";
            errorBox.classList.add("visible");
          }
        });
        return pump();
      });
    }
    return pump();
  }).catch(function(e){
    errorBox.textContent = "Connection lost. Please try again.";
    errorBox.classList.add("visible");
  }).finally(function(){
    runBtn.disabled = false;
  });
};

loadSessions();
</script>
</body>
</html>
